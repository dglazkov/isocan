<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" width="820" height="610" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- The recommended look for the arrows between kept wireframe screens, at rest.
       Four kept app screens in one row, as flow.ts lays them (80-unit gutters), drawn here at ~0.3 of world size.
       Numbered marks are explained underneath. docs/research/2026-09-23-flow-arrows.md -->
  <rect width="820" height="610" fill="#fbfbf9"/>
  <g fill="#c9ccc4"><circle cx="20" cy="20" r="1"/><circle cx="800" cy="20" r="1"/><circle cx="20" cy="420" r="1"/><circle cx="800" cy="420" r="1"/></g>

  <!-- screens: each item is its caption (the wire file draws it) and its frame, so an item's top edge is the caption's top, y=132 here -->
  <g font-size="10" fill="#23262b">
    <text x="40" y="142" font-weight="700">Sign in <tspan fill="#8a8f96" font-size="7" font-weight="500" letter-spacing=".06em">WIREFRAME</tspan></text>
    <text x="220" y="142" font-weight="700">Verify <tspan fill="#8a8f96" font-size="7" font-weight="500" letter-spacing=".06em">WIREFRAME</tspan></text>
    <text x="400" y="142" font-weight="700">Home <tspan fill="#8a8f96" font-size="7" font-weight="500" letter-spacing=".06em">WIREFRAME</tspan></text>
    <text x="580" y="142" font-weight="700">Detail <tspan fill="#8a8f96" font-size="7" font-weight="500" letter-spacing=".06em">WIREFRAME</tspan></text>
  </g>
  <g fill="#fff" stroke="#d9dbd4" stroke-width="1.2">
    <rect x="40" y="150" width="120" height="250" rx="12"/>
    <rect x="220" y="150" width="120" height="250" rx="12"/>
    <rect x="400" y="150" width="120" height="250" rx="12"/>
    <rect x="580" y="150" width="120" height="250" rx="12"/>
  </g>
  <!-- screen contents, greyscale -->
  <g fill="#e6e7e3">
    <rect x="55" y="180" width="60" height="7" rx="3"/><rect x="55" y="198" width="90" height="14" rx="3"/><rect x="55" y="222" width="90" height="14" rx="3"/>
    <rect x="235" y="175" width="90" height="6" rx="3"/><rect x="238" y="192" width="14" height="16" rx="2"/><rect x="256" y="192" width="14" height="16" rx="2"/><rect x="274" y="192" width="14" height="16" rx="2"/><rect x="292" y="192" width="14" height="16" rx="2"/>
    <rect x="415" y="172" width="50" height="7" rx="3"/><rect x="415" y="190" width="90" height="16" rx="3"/><rect x="415" y="212" width="90" height="16" rx="3"/><rect x="415" y="234" width="90" height="16" rx="3"/>
    <rect x="595" y="175" width="90" height="10" rx="3"/><rect x="595" y="195" width="60" height="6" rx="3"/><rect x="595" y="210" width="80" height="6" rx="3"/><rect x="595" y="225" width="70" height="6" rx="3"/>
  </g>
  <rect x="55" y="262" width="90" height="20" rx="4" fill="#2a2d31"/><text x="100" y="275.5" font-size="8" fill="#fff" text-anchor="middle" font-weight="700">Sign in</text>
  <rect x="250" y="220" width="60" height="16" rx="4" fill="#2a2d31"/><text x="280" y="231" font-size="7.5" fill="#fff" text-anchor="middle" font-weight="700">Submit</text>
  <g stroke="#e6e7e3" stroke-width="1"><line x1="400" y1="372" x2="520" y2="372"/></g>
  <g fill="#c9ccc4"><circle cx="425" cy="385" r="4"/><circle cx="460" cy="385" r="4"/><circle cx="495" cy="385" r="4"/></g>

  <!-- the arrows: under the screens, never through one -->
  <g fill="none" stroke="#1f3fd0" stroke-width="1.5" stroke-linejoin="round">
    <!-- a jump: Sign in -> Home, over Verify, on lane 0 -->
    <path d="M 100 132 V 108 Q 100 96 112 96 H 418 Q 430 96 430 108 V 126"/>
    <!-- a step: Verify's Submit -> Home, at the button's height -->
    <path d="M 340 228 H 391"/>
    <!-- a step: Home's rows -> Detail, at the first row's height -->
    <path d="M 520 198 H 571"/>
  </g>
  <g fill="#1f3fd0">
    <!-- ports: where each link leaves, on its source's edge -->
    <circle cx="100" cy="132" r="2.6"/><circle cx="340" cy="228" r="2.6"/><circle cx="520" cy="198" r="2.6"/>
    <!-- heads: filled, notched, 9 x 8 px; the tip stops short of the target -->
    <path d="M 430 126 L 426 117 L 430 119.25 L 434 117 Z"/>
    <path d="M 394 228 L 385 224 L 387.25 228 L 385 232 Z"/>
    <path d="M 574 198 L 565 194 L 567.25 198 L 565 202 Z"/>
  </g>
  <!-- the label: the hotspot's own words, on the straight run, the line hidden behind it -->
  <rect x="238" y="88" width="44" height="16" rx="4" fill="#fbfbf9"/>
  <text x="260" y="100" font-size="11" font-weight="600" fill="#1f3fd0" text-anchor="middle">Sign in</text>

  <!-- numbered marks -->
  <g font-size="10" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="190" cy="80" r="8" fill="#23262b"/><text x="190" y="83.5">1</text>
    <circle cx="84" cy="114" r="8" fill="#23262b"/><text x="84" y="117.5">2</text>
    <circle cx="366" cy="212" r="8" fill="#23262b"/><text x="366" y="215.5">3</text>
    <circle cx="394" cy="248" r="8" fill="#23262b"/><text x="394" y="251.5">4</text>
    <circle cx="300" cy="80" r="8" fill="#23262b"/><text x="300" y="83.5">5</text>
    <circle cx="460" cy="414" r="8" fill="#23262b"/><text x="460" y="417.5">6</text>
  </g>

  <!-- what the marks mean -->
  <g font-size="11.5" fill="#23262b">
    <g font-weight="700" fill="#fff" text-anchor="middle" font-size="9">
      <circle cx="46" cy="446" r="7" fill="#23262b"/><text x="46" y="449">1</text>
      <circle cx="46" cy="468" r="7" fill="#23262b"/><text x="46" y="471">2</text>
      <circle cx="46" cy="490" r="7" fill="#23262b"/><text x="46" y="493">3</text>
      <circle cx="46" cy="512" r="7" fill="#23262b"/><text x="46" y="515">4</text>
      <circle cx="46" cy="534" r="7" fill="#23262b"/><text x="46" y="537">5</text>
      <circle cx="46" cy="556" r="7" fill="#23262b"/><text x="46" y="559">6</text>
    </g>
    <text x="60" y="450">A jump rides a lane over the row. The shortest span takes the lowest lane; legs are ordered on each edge so none cross.</text>
    <text x="60" y="472">It leaves from the hotspot: a jump from the top edge at the hotspot's column, a step from the facing side at its height.</text>
    <text x="60" y="494">A step to a neighbour is one straight segment in the 80-unit gutter. Two hotspots to one screen are two arrows.</text>
    <text x="60" y="516">Head: filled and notched, 9 × 8 screen px at every zoom; the tip stops 10 world units short of the target.</text>
    <text x="60" y="538">The label is the hotspot's own ("Sign in", "Row"), on a straight run, and only when the run can hold it.</text>
    <text x="60" y="560">Tabs, back and loose ends are not drawn at rest; pointing at a screen shows its tabs and what it still needs.</text>
  </g>
  <!-- style legend -->
  <g font-size="11" fill="#686e75">
    <line x1="40" y1="590" x2="80" y2="590" stroke="#1f3fd0" stroke-width="1.5"/><text x="88" y="594">changes the screen (push, dissolve)</text>
    <line x1="300" y1="590" x2="340" y2="590" stroke="#1f3fd0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="348" y="594">opens over it (overlay)</text>
    <line x1="510" y1="590" x2="550" y2="590" stroke="#686e75" stroke-width="1.5" stroke-dasharray="1.5 3.5" stroke-linecap="round"/><text x="558" y="594">tab — only while you point at a screen</text>
  </g>
</svg>
