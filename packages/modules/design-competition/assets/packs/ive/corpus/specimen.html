<!doctype html>
<!-- Purpose: Confirm a single plant delivery with calm clarity and zero clutter. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inevitable — Specimen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: system-ui, -apple-system, Inter, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
    .sheet {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 36px rgb(0 0 0 / 0.06);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .stage {
      height: 180px;
      border-radius: 12px; /* concentric: 20px outer - 8px visual rhythm */
      background: #f5f5f7;
      display: grid;
      place-items: center;
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.022em;
    }
    .sub {
      margin-top: 8px;
      font-size: 17px;
      line-height: 1.47;
      color: #6e6e73;
    }
    .rows {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #d2d2d7;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 44px;
      border-bottom: 1px solid #d2d2d7;
      font-size: 17px;
    }
    .row span:last-child { color: #6e6e73; }
    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .primary {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      background: #0071e3;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .primary:active { transform: scale(0.985); }
    .text-btn {
      background: none;
      border: 0;
      color: #0071e3;
      font-size: 17px;
      font-weight: 400;
      height: 44px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="stage" aria-hidden="true">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
        <path d="M36 58V22M36 34C24 34 18 24 20 14C30 14 36 22 36 34ZM36 28C46 28 52 19 51 11C42 11 36 18 36 28Z" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h1>Ficus Lyrata</h1>
      <p class="sub">Potted in matte stoneware. Arrives Thursday afternoon.</p>
    </div>
    <div class="rows">
      <div class="row"><span>Vessel</span><span>Stoneware · 24 cm</span></div>
      <div class="row"><span>Total</span><span>$84</span></div>
    </div>
    <div class="actions">
      <button class="primary" type="button">Order</button>
      <button class="text-btn" type="button">Change delivery window</button>
    </div>
  </main>
</body>
</html>
