<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Immediate Connection — Specimen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: #1b1b1b;
      font-family: "Source Serif 4", Georgia, serif;
      padding: 48px;
      line-height: 1.6;
      font-size: 19px;
    }
    main { max-width: 66ch; display: grid; gap: 32px; }
    h1 { font-size: 30px; font-weight: 600; line-height: 1.2; }
    .scrub {
      color: #0e7490;
      font-weight: 600;
      border-bottom: 1.5px dotted #0e7490;
      cursor: ew-resize;
      user-select: none;
      font-variant-numeric: tabular-nums;
      padding: 0 2px;
    }
    .computed {
      color: #b45309;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .multiples {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      border-top: 1px solid #e3e3e3;
      padding-top: 16px;
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 13px;
      color: #5f5f5f;
    }
    .mult {
      padding: 8px;
      border: 1px solid #e3e3e3;
      border-radius: 3px;
      cursor: pointer;
    }
    .mult.active { border-color: #0e7490; background: #f4fbfd; color: #1b1b1b; }
  </style>
</head>
<body>
  <main>
    <h1>Watering schedule &amp; survival explorer</h1>
    <p>
      With <span id="sun" class="scrub" tabindex="0" role="slider" aria-label="Direct sun hours" aria-valuemin="1" aria-valuemax="8" aria-valuenow="4">4 hours</span>
      of direct sun a day, a 24 cm terracotta pot dries in
      <span id="days" class="computed">6 days</span> and needs
      <span id="ml" class="computed">420 mL</span> of water per week.
    </p>
    <div class="multiples" id="grid" aria-label="Comparison across sun hours"></div>
  </main>
  <script>
    const sunEl = document.getElementById("sun");
    const daysEl = document.getElementById("days");
    const mlEl = document.getElementById("ml");
    const grid = document.getElementById("grid");
    let hours = 4;
    function render() {
      const days = Math.max(2, Math.round(10 - hours));
      const ml = 220 + hours * 50;
      sunEl.textContent = `${hours} hour${hours === 1 ? "" : "s"}`;
      sunEl.setAttribute("aria-valuenow", String(hours));
      daysEl.textContent = `${days} days`;
      mlEl.textContent = `${ml} mL`;
      grid.innerHTML = [1, 2, 4, 6, 8].map((h) =>
        `<div class="mult ${h === hours ? "active" : ""}" data-h="${h}">
          <strong>${h}h sun</strong><br/>every ${Math.max(2, 10 - h)}d · ${220 + h * 50} mL
        </div>`
      ).join("");
      grid.querySelectorAll(".mult").forEach((el) =>
        el.addEventListener("click", () => { hours = Number(el.dataset.h); render(); })
      );
    }
    sunEl.addEventListener("pointerdown", (e) => {
      const startX = e.clientX, startH = hours;
      const move = (ev) => {
        hours = Math.min(8, Math.max(1, startH + Math.round((ev.clientX - startX) / 18)));
        render();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", () => window.removeEventListener("pointermove", move), { once: true });
    });
    render();
  </script>
</body>
</html>
