<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Plain Words — Specimen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fbfaf6;
      color: #1c1b18;
      font-family: Inter, system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
    }
    .sheet {
      max-width: 560px;
      background: #ffffff;
      border: 1px solid #e5e2d9;
      border-radius: 12px;
      padding: 44px;
      box-shadow: 0 4px 20px rgb(28 27 24 / 0.05);
      display: grid;
      gap: 24px;
      justify-items: center;
    }
    h1 {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.025em;
    }
    p { font-size: 18px; line-height: 1.6; color: #59564f; }
    mark {
      background: linear-gradient(transparent 55%, #fff275 55%);
      color: #1c1b18;
      padding: 0 3px;
    }
    .cta {
      height: 52px;
      padding: 0 28px;
      border-radius: 999px;
      border: 0;
      background: #1d6f42;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .note { font-size: 14px; color: #59564f; }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>One Ficus, heading to your front porch.</h1>
    <p>
      We already potted it in matte white stoneware with fresh bark mix, and our local driver drops it off
      <mark>Thursday afternoon between 2 and 5 — $84 flat, delivery included.</mark>
    </p>
    <button class="cta" type="button">Yes, bring the Ficus Thursday</button>
    <span class="note">No signature needed · Leave it under the awning if it rains.</span>
  </main>
</body>
</html>
