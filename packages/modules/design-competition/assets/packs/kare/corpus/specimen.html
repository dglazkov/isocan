<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Road Signs — Specimen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0 / 2px 2px;
      font-family: "Public Sans", system-ui, sans-serif;
      color: #000000;
    }
    .win {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #000000;
      box-shadow: 2px 2px 0 #000000;
    }
    .titlebar {
      height: 24px;
      border-bottom: 1px solid #000000;
      background: repeating-linear-gradient(to bottom, #fff 0 2px, #000 2px 3px, #fff 3px 4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      position: relative;
    }
    .close-box {
      position: absolute;
      left: 8px;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border: 1px solid #000000;
    }
    .win-title {
      background: #ffffff;
      padding: 0 8px;
      font-family: Silkscreen, ui-monospace, monospace;
      font-size: 16px;
      line-height: 20px;
    }
    .content { padding: 16px; display: grid; gap: 16px; }
    .icon-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      text-align: center;
    }
    .tile {
      border: 1px solid #000000;
      padding: 8px;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-family: "Pixelify Sans", ui-monospace, monospace;
      font-size: 16px;
    }
    .tile[aria-pressed="true"] { background: #000000; color: #ffffff; }
    .tile[aria-pressed="true"] svg rect[fill="#000000"] { fill: #ffffff; }
    .btn-ring {
      border: 1px solid #000000;
      padding: 2px;
      justify-self: end;
    }
    .btn {
      height: 32px;
      padding: 4px 16px;
      border: 1px solid #000000;
      background: #ffffff;
      font-family: "Pixelify Sans", ui-monospace, monospace;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:active { background: #000000; color: #ffffff; }
  </style>
</head>
<body>
  <div class="win" role="dialog" aria-label="Plant Order">
    <div class="titlebar">
      <span class="close-box" aria-hidden="true"></span>
      <span class="win-title">GREENHOUSE</span>
    </div>
    <div class="content">
      <p style="font-size: 16px; line-height: 24px;">Pick a sunny pot for your new fern:</p>
      <div class="icon-row">
        <button class="tile" type="button" aria-pressed="true">
          <svg width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <rect x="3" y="4" width="10" height="2" fill="#000000"/>
            <rect x="4" y="6" width="8" height="7" fill="#000000"/>
            <rect x="6" y="8" width="1" height="1" fill="#ffffff"/>
            <rect x="9" y="8" width="1" height="1" fill="#ffffff"/>
            <rect x="6" y="10" width="4" height="1" fill="#ffffff"/>
          </svg>
          <span>Clay Pot</span>
        </button>
        <button class="tile" type="button" aria-pressed="false">
          <svg width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <rect x="5" y="2" width="6" height="2" fill="#000000"/>
            <rect x="3" y="4" width="10" height="9" fill="#000000"/>
            <rect x="5" y="6" width="6" height="5" fill="#ffffff"/>
          </svg>
          <span>Tin Pail</span>
        </button>
        <button class="tile" type="button" aria-pressed="false">
          <svg width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <rect x="2" y="8" width="12" height="5" fill="#000000"/>
            <rect x="7" y="3" width="2" height="5" fill="#000000"/>
            <rect x="4" y="5" width="3" height="2" fill="#000000"/>
          </svg>
          <span>Gift Box</span>
        </button>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>Total: $36</span>
        <span class="btn-ring"><button class="btn" type="button">Send Plant…</button></span>
      </div>
    </div>
  </div>
</body>
</html>
