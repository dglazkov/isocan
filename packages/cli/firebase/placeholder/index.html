<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>isocan</title>
    <!--
      What a provisioned canvas serves until the guest app exists (#73).

      Hosting has to serve SOMETHING from the moment the remote is provisioned
      (#69) — the site is deployed before there is a mirror to read (#70), a
      token to redeem (#72), or an app that knows how to do either. The local
      web app is the wrong something: it talks to a daemon at its own origin,
      and there is no daemon here, so it renders a welcome screen and then
      fails on the first API call.

      An address that explains itself beats one that looks alive and is not —
      the same reason `isocan unshare` leaves a page standing rather than a
      404. This is that page, for the other end of the same life.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1a1a1c;
        --quiet: #6b6b73;
        --ground: #f4f4f5;
        --card: #ffffff;
        --edge: #e4e4e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ececf0;
          --quiet: #9a9aa4;
          --ground: #131316;
          --card: #1c1c20;
          --edge: #2c2c33;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--ground);
        color: var(--ink);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 28px 32px 30px;
        background: var(--card);
        border: 1px solid var(--edge);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 10px;
      }
      p:last-child {
        margin-bottom: 0;
        color: var(--quiet);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nothing is shared here yet.</h1>
      <p>
        This address is where an <strong>isocan</strong> canvas lives once its owner shares it.
        The setup is finished — but no canvas has been published to it.
      </p>
      <p>
        If someone sent you this link, it is not live yet. Tell them, and they can run
        <code>isocan share</code> again once it is.
      </p>
    </main>
  </body>
</html>
