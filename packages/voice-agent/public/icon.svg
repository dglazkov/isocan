<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="isocan">
  <!--
    The mark is the product, not a letter: this app's stylesheet opens by
    naming its identity as a vellum ground with a dot grid carrying hairline
    cards, and that is exactly what a canvas of items looks like from far
    enough away. One card on a field of dots.

    Drawn for SIXTEEN pixels, which is where a favicon actually lives: two
    shapes, no text, no hairlines, and the card takes enough of the frame to
    survive being drawn four times smaller than this. The dots become texture
    at that size rather than dots, which is the right thing for them to do.

    The cobalt is the accent token (#1f3fd0), the one colour this product uses
    to mean "yours" — the same ink as the selection ring and the active line.
    It carries on a light tab bar and a dark one alike, so the card needs no
    theme handling; only the dots do, and they only need a nudge.

    NOTE: an SVG is XML, and XML forbids a double hyphen inside a comment. The
    first draft of this file named its colour tokens the way the stylesheet
    does and the whole document failed to parse — served correctly, decoded as
    nothing, rendered as a broken image. Do not write token names here.
  -->
  <style>
    .dot { fill: #a9aea6; }
    @media (prefers-color-scheme: dark) { .dot { fill: #4a5058; } }
  </style>
  <g class="dot">
    <circle cx="4" cy="4" r="1.3" /><circle cx="12" cy="4" r="1.3" />
    <circle cx="20" cy="4" r="1.3" /><circle cx="28" cy="4" r="1.3" />
    <circle cx="4" cy="12" r="1.3" /><circle cx="28" cy="12" r="1.3" />
    <circle cx="4" cy="20" r="1.3" /><circle cx="28" cy="20" r="1.3" />
    <circle cx="4" cy="28" r="1.3" /><circle cx="12" cy="28" r="1.3" />
    <circle cx="20" cy="28" r="1.3" /><circle cx="28" cy="28" r="1.3" />
  </g>
  <rect x="6" y="8" width="22" height="16" rx="3.5" fill="#1f3fd0" />
  <!-- The card's own titlebar, which is what an isocan item wears: present at
       32px, gone to a shade at 16, and never a hairline that would alias. -->
  <rect x="9.5" y="11.5" width="10" height="2.2" rx="1.1" fill="#ffffff" opacity="0.78" />
</svg>
