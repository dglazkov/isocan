<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>isocan</title>
    <!-- One SVG rather than a pile of PNGs: it is sharp at every size a tab
         bar asks for, it carries its own dark-mode rule, and it is 1KB. The
         `.ico` fallback older Safari would want is deliberately not here —
         nothing in this app has ever been built for a browser that old, and
         an icon nobody can regenerate is worse than a letter. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- **The handwriting face, served from here.**

         Handwriting is the one face that cannot come from the system stack:
         CSS `cursive` resolves to Comic Sans on Windows and Snell Roundhand —
         formal calligraphy — on macOS, which are opposite tones, so unlike
         sans/serif/mono the INTENT does not survive the trip. It is ship a
         file or do not offer it.

         It WAS a Google Fonts link, taken deliberately and as a stated
         temporary: the CDN bought the ability to swap the face in one line
         while we found out which handwriting felt right on a canvas. That
         choice has settled on Caveat, so the two costs recorded beside that
         link are now paid off rather than carried — offline it is still
         handwriting, and nobody outside this machine is told who is looking.

         One file: the latin subset is a VARIABLE font, so 400 and 700 are the
         same 73KB rather than two downloads. `font-display: swap` so nothing
         ever waits on it, and the fallbacks below are what renders in the
         moment before it lands.

         SIL Open Font License 1.1, which requires the licence to travel with
         the font — `Caveat-OFL.txt` sits beside it and is served from the
         same directory. Copyright 2014 The Caveat Project Authors. -->
    <style>
      /* **The interface face, served from here for the same reason Caveat is.**

         The app shipped with `system-ui` and nothing else — no scale, no
         weights, no tracking. That renders as SF Pro on a Mac, Segoe on
         Windows and Roboto on Linux: three different products, none of them
         chosen, and every measurement in the design (a 48px strip, a 320px
         rail, a label that must not wrap) taken against a face that changes
         under it.

         Inter is the deliberate answer. It was drawn for interface text at
         exactly the sizes this app lives at, its figures line up in columns,
         and it holds together at the 11px the micro-labels use, which is
         where system stacks diverge most.

         SELF-HOSTED, not a CDN link, and not a choice worth re-litigating:
         isocan runs against a daemon on localhost and must work with no
         network at all. A font that arrives over the wire is a font that is
         missing exactly when somebody is working on a plane. It also means no
         third party is told who is looking at a canvas.

         One file: the latin subset is a VARIABLE font, so every weight from
         400 to 700 is the same 48KB rather than four downloads.
         `font-display: swap` so nothing ever waits on it, and the stack below
         is what renders in the moment before it lands — system-ui first,
         because the old look is a better flash than a serif.

         SIL Open Font License 1.1, same as Caveat: `Inter-OFL.txt` sits
         beside it and is served from the same directory. Copyright 2016 The
         Inter Project Authors. */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/inter-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Caveat";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/caveat-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // one. Kept in sync afterwards by src/lib/theme.ts (same storage key).
      (function () {
        try {
          var pref = localStorage.getItem("isocan.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <link rel="stylesheet" crossorigin href="/assets/index-DmQfAtyK.css">
