<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Less, but Better — Specimen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f3f2ee;
      color: #222222;
      font-family: Inter, system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px;
    }
    .appliance {
      width: 100%;
      max-width: 440px;
      background: #f3f2ee;
      border: 1px solid #c4c3bf;
      border-radius: 4px;
      padding: 24px;
      display: grid;
      gap: 24px;
    }
    .header-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .grille {
      width: 96px;
      height: 32px;
      background-image: radial-gradient(#a8a7a2 1.25px, transparent 1.25px);
      background-size: 8px 8px;
    }
    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #66655f;
      margin-bottom: 4px;
    }
    .readout {
      background: #222222;
      color: #f3f2ee;
      border-radius: 2px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
    }
    .readout strong { font-size: 28px; font-weight: 400; }
    .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .key {
      height: 48px;
      background: #fbfaf7;
      border: 1px solid #c4c3bf;
      border-radius: 4px;
      box-shadow: inset 0 -1px 0 #c4c3bf;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }
    .lamp {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d9d8d4;
    }
    .key[aria-pressed="true"] .lamp { background: #e8641b; }
    .confirm {
      height: 44px;
      background: #e8641b;
      color: #222222;
      border: 0;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <section class="appliance" aria-label="Order control panel">
    <div class="header-grid">
      <div>
        <div class="label">model</div>
        <div style="font-size: 15px; font-weight: 500;">ficus lyrata · 24 cm</div>
      </div>
      <div class="grille" aria-hidden="true"></div>
    </div>
    <div>
      <div class="label">total amount</div>
      <div class="readout">
        <span>thursday 14:00</span>
        <strong>84.00 usd</strong>
      </div>
    </div>
    <div>
      <div class="label">pot material</div>
      <div class="keys">
        <button class="key" type="button" aria-pressed="true">
          <span class="lamp"></span>
          <span style="font-size: 13px;">clay</span>
        </button>
        <button class="key" type="button" aria-pressed="false">
          <span class="lamp"></span>
          <span style="font-size: 13px;">zinc</span>
        </button>
        <button class="key" type="button" aria-pressed="false">
          <span class="lamp"></span>
          <span style="font-size: 13px;">ceramic</span>
        </button>
      </div>
    </div>
    <button class="confirm" type="button">place order</button>
  </section>
</body>
</html>
