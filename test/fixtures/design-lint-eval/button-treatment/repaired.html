<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme compact action</title>
  <style>
    :root {
      --color-ink: #203040;
      --color-accent: #285c98;
      --color-paper: #f4f7fa;
      --color-surface: #ffffff;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 32px;
      --radius-control: 8px;
      --radius-large: 16px;
      --size-body: 16px;
      --size-title: 24px;
      --local-ink: var(--color-ink);
      --space-lane: var(--space-md);
    }
    body { margin: 0; padding: var(--space-md); font-family: Arial, sans-serif; font-size: var(--size-body); line-height: 1.5; color: var(--local-ink); background-color: var(--color-paper); }
    #card { max-width: 520px; margin: 0 auto; padding: var(--space-md); border: 1px solid var(--color-accent); border-radius: var(--radius-control); background-color: var(--color-surface); }
    #title { margin: 0 0 var(--space-md); font-size: var(--size-title); line-height: 1.25; }
    #description { margin: 0 0 var(--space-md); color: var(--local-ink); font: 400 16px/1.5 Arial, sans-serif; }
    #accent { display: block; margin: 0 0 var(--space-md); color: var(--color-accent); }
    #action { font-family: Arial, sans-serif; font-size: var(--size-body); line-height: 1.5; padding: var(--space-sm); border: 0; border-radius: var(--radius-control); color: var(--color-surface); background-color: var(--color-accent); cursor: pointer; }
    #feedback { max-width: 280px; margin: auto; padding: var(--space-md); border: 1px solid var(--color-accent); border-radius: var(--radius-control); color: var(--color-ink); background-color: var(--color-surface); font-size: var(--size-body); line-height: 1.5; }
  </style>
</head>
<body>
  <main id="card" aria-labelledby="title">
    <h1 id="title">Keep the action compact</h1>
    <p id="description">A compact action completes this card. Its shape belongs to the Button recipe and its compact treatment.</p>
    <strong id="accent">Compact control</strong>
    <button id="action" type="button" popovertarget="feedback" data-isocan-recipe="Button" data-isocan-treatment="compact">Save selection</button>
    <div id="feedback" popover>The selection is saved for this example.</div>
  </main>
</body>
</html>
