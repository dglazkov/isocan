<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme signup</title><style>:root{font:16px/1.5 system-ui;color:#203040;background:#f4f7fa}main{max-width:30rem;margin:4rem auto;padding:24px;background:white}h1{font-size:24px}input,button{font:inherit;padding:8px;border-radius:8px}label,input{display:block}button{margin-top:16px;background:#285c98;color:white}p{min-height:1.5em}</style><main><h1>Acme field notes</h1><p>Receive one useful note each month.</p><form novalidate><label for="email">Email address</label><input id="email" type="email" required aria-describedby="error"><p id="error" role="alert"></p><button>Subscribe</button></form><p id="confirmation" role="status"></p></main><script>const form=document.querySelector("form"),email=document.querySelector("#email");form.addEventListener("submit",e=>{e.preventDefault();if(!email.validity.valid){document.querySelector("#error").textContent="Invalid email";email.setAttribute("aria-invalid","true");email.focus();return}document.querySelector("#error").textContent="";email.removeAttribute("aria-invalid");document.querySelector("#confirmation").textContent="You are on the Acme field notes list."});</script></html>
