<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme receiving</title><style>body{font:16px/1.5 system-ui;color:#203040;background:#f4f7fa;padding:24px}main{max-width:44rem;margin:auto}input,button{font:inherit;padding:8px}button{background:#285c98;color:white;border-radius:8px}</style><main><h1>Receive stock</h1><p>Continuous scanning · review before saving</p><label for="sku">SKU</label><input id="sku" value="BTL-20"><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" value="2"><button id="review">Review receipt</button><p id="summary" role="status"></p></main><script>document.querySelector("#review").onclick=()=>{document.querySelector("#summary").textContent=document.querySelector("#sku").value+": "+document.querySelector("#quantity").value+" units ready to review"};</script></html>
