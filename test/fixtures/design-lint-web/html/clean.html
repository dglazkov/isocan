<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme labelled controls</title></head>
<body>
  <main>
    <h1>Acme controls</h1>
    <p>Complete the labelled field.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <button type="button">Continue</button>
  </main>
</body>
</html>
