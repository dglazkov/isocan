<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, Yu</title>
<style>
  /* The design system already on the canvas. Use these; do not invent values. */
  :root {
    --paper: #ffffff; --panel: #f6f8fa; --ink: #1f2328; --muted: #57606a; --line: #d0d7de;
    --accent: #0969da; --accent-ink: #ffffff; --good: #1a7f37; --bad: #cf222e;
    --radius: 8px; --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 40px;
    --text-s: 14px; --text-m: 16px; --text-l: 20px; --text-xl: 28px;
  }
  body { margin: 0; font: var(--text-m)/1.5 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 720px; margin: 0 auto; padding: var(--space-4) var(--space-3); }
  .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: var(--space-5) var(--space-4); text-align: center; }
  .card h1 { font-size: var(--text-xl); margin: 0 0 var(--space-2); }
  .card p { margin: 0; color: var(--muted); font-size: var(--text-l); }
  .card .from { margin-top: var(--space-4); font-size: var(--text-s); color: var(--accent); }
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="hello">
    <h1 id="hello">Hello, Yu</h1>
    <p>Welcome to the canvas. Pull up a chair — there is room, and the coffee is on.</p>
    <p class="from">From everyone already here</p>
  </section>
</main>
</body>
</html>
