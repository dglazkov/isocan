# Stitch Loop's insights, pulled nightly (plates practice `loop`; managed: plates
# render rewrites it).
#
# READS LOOP AND WRITES FILES; DECIDES NOTHING AND SENDS NOTHING. A pull files
# new insights as `untriaged` findings in docs/loop/, refreshes what Loop says
# about the ones already there, and rebuilds docs/LOOP.md. It never runs
# decide, push, mine or propose: a decision dismisses an insight for everyone
# in the workspace, and that is a person's act; proposing with a model here is
# a later, priced decision. The rules (plates docs/design.md §6, from isocan's
# loop.yml and its "night shift's pull requests"):
#
#   - A bot writes a pull request, never to main. The only push names
#     refs/heads/keel-loop/<date>.
#   - One open PR per queue, the newest; the night practice's
#     scripts/plates/drain.mjs plates-loop/ enforces it, from this repo. Without
#     the night practice there is no drain, and the run says so (a notice).
#   - A merge is checked, not trusted. A GITHUB_TOKEN PR runs no CI, so this
#     run's gate (render --check, then the project's own) is the check; the
#     newest merges only when it passed and the PR holds only docs/loop/,
#     docs/LOOP.md and what .plates/plates.json "loop" "afterRenderWrites" names.
#   - The PR is the tree the gate passed on. A pull also runs the project's
#     afterRender (ledger's roadmap counts findings); a file it rewrites but
#     the PR leaves out passes the gate here and is stale on main (plates
#     lesson: a gate that checks a tree it does not commit).
#   - A guard fires into a room someone is in: a pull that cannot reach Loop,
#     or a gate that fails, makes this run red, and GitHub emails.
#
# SECRET, and until it exists the run ends green with a notice (an
# unconfigured repo is not a broken one):
#   STITCH_API_KEY  the Loop key the official stitch CLI (@google/stitch on
#                   npm) reads
# A project whose `setup` must clone a private repo names a secret in
# .plates/plates.json "setupToken"; the Install step alone gets it, as GH_TOKEN.
# The workspace is .stitch.json's "workspace" (STITCH_WORKSPACE overrides it).
# Repo setting: Actions must be allowed to create pull requests.
name: plates-loop

on:
  schedule:
    # 09:43 UTC: after plates-night (07:23), off the hour.
    - cron: "43 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: plates-loop
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  # Read-only: the gate step reuses CI's result for an unchanged commit.
  actions: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      transfer: ${{ steps.transfer.outputs.ready }}
      # The producer's own attempt: rerunning only publish keeps this value.
      publication: plates-loop-publication-${{ github.run_attempt }}
      head: ${{ steps.prepare.outputs.head }}
      day: ${{ steps.prepare.outputs.day }}
      gate: ${{ steps.gate.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Configured?
        id: configured
        env:
          STITCH_CONFIGURED: ${{ secrets.STITCH_API_KEY != '' }}
        run: |
          echo "ready=$STITCH_CONFIGURED" >> "$GITHUB_OUTPUT"
          if [ "$STITCH_CONFIGURED" != true ]; then echo "::notice::Skipped: add the STITCH_API_KEY secret to run the nightly Loop pull."; fi

      # The project's install, read from .plates/plates.json at run time (so a
      # config change never needs a re-render): `setup` when it has one, else
      # npm ci when a lockfile exists. Its `env` goes to every later step
      # (scripts/plates/improve.mjs applies it to the gate too), so a gate that
      # must not sync or push is told so before anything runs.
      - name: Read the config
        if: steps.configured.outputs.ready == 'true'
        id: config
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".plates/plates.json", "utf8"));
            const env = c.env ?? {};
            if (!env || typeof env !== "object" || Array.isArray(env)) throw new Error(".plates/plates.json: \"env\" must be an object of NAME: \"value\"");
            if (c.setup !== undefined && (typeof c.setup !== "string" || !c.setup.trim())) throw new Error(".plates/plates.json: \"setup\" must be a non-empty shell command");
            const tok = c.setupToken;
            if (tok !== undefined && (typeof tok !== "string" || !/^[A-Z_][A-Z0-9_]*$/.test(tok) || tok.startsWith("GITHUB_") || c.setup === undefined)) throw new Error(".plates/plates.json: \"setupToken\" must name a repo secret (not GITHUB_*) and needs a \"setup\"");
            const eof = `PLATES_EOF_${Date.now()}`;
            const lines = [];
            for (const [k, v] of Object.entries(env)) {
              if (!/^[A-Z_][A-Z0-9_]*$/.test(k) || typeof v !== "string") throw new Error(`.plates/plates.json: "env" ${k} must be NAME: "value"`);
              lines.push(`${k}<<${eof}`, v, eof);
              console.log(`env: ${k}`);
            }
            if (lines.length) fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup<<${eof}\n${c.setup ?? ""}\n${eof}\n`);
            // Only the secret NAME, never its value: the Install step looks it up.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup_token=${tok ?? ""}\n`);
            if (tok) console.log(`setupToken: ${tok} (a repo secret, for the Install step only)`);
            // What a pull writes: the findings, their page, and the files the
            // afterRender rewrites of the project. Same rule as scripts/loop.mjs.
            const plain = p => typeof p === "string" && p.trim() === p && p !== "" && !p.startsWith("/") && !p.endsWith("/") &&
              !p.split("/").some(s => s === ".." || s === "." || s === "") && !p.startsWith(".github/") && !/[*?[\]\\\s]/.test(p);
            const writes = Array.isArray(c.loop?.afterRenderWrites) ? c.loop.afterRenderWrites : [];
            for (const p of writes) if (!plain(p)) throw new Error(`.plates/plates.json: "loop" "afterRenderWrites" ${JSON.stringify(p)} must be a repo-relative file path`);
            const paths = ["docs/loop", "docs/LOOP.md", ...writes].join(" ");
            console.log(`a pull writes: ${paths}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `paths=${paths}\n`);
          '
      - name: Install
        if: steps.configured.outputs.ready == 'true'
        # setupToken (a secret's name in .plates/plates.json) becomes GH_TOKEN here
        # and in no other step, so setup can clone a private repo with gh
        # (private data). Absent or unset, no token. Never echoed.
        env:
          SETUP: ${{ steps.config.outputs.setup }}
          GH_TOKEN: ${{ secrets[steps.config.outputs.setup_token] || '' }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "setup (.plates/plates.json): $SETUP"
            bash -e -c "$SETUP"
          elif [ -f package-lock.json ]; then
            npm ci
          fi

      # Exact previously checked CLI release; installation receives no provider key.
      - name: Install the stitch CLI
        if: steps.configured.outputs.ready == 'true'
        run: |
          npm install -g @google/stitch@0.11.0 --ignore-scripts
          stitch --version

      # Loop is off in a fresh CLI until it is switched on, per runner (isocan's
      # nightlies of 29 Sep to 1 Oct all died on this). Failing is red.
      - name: Turn Loop on in the CLI
        if: steps.configured.outputs.ready == 'true'
        run: stitch enable loop

      # A pull that cannot reach Loop fails here, loudly.
      - name: Pull Loop's insights
        id: insights
        if: steps.configured.outputs.ready == 'true'
        env:
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
        run: |
          if [ -z "$STITCH_API_KEY" ]; then
            echo "::notice::Skipped: add the STITCH_API_KEY secret to run the nightly Loop pull."
            exit 0
          fi
          node scripts/loop.mjs pull
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The project's check through the night's scripts/plates/gate.mjs when it
      # is here: a pull that changed nothing leaves the default branch's
      # commit, clean, and CI's exact result for it stands (said in the log);
      # a pull that changed findings is a dirty tree, never reused, so it runs.
      - name: Gate
        id: gate
        if: steps.insights.outputs.ready == 'true'
        # gate.mjs reads an exact CI result with this read-only token and runs
        # the check without it; a project check (no gate.mjs) never sees it.
        env:
          GATE_TOKEN: ${{ github.token }}
        run: |
          check() { if [ -f scripts/plates/gate.mjs ]; then GH_TOKEN="$GATE_TOKEN" env -u GATE_TOKEN node scripts/plates/gate.mjs; else (unset GATE_TOKEN; npm test && npm run typecheck && node --test tests/loop.test.mjs); fi; }
          if node scripts/loop.mjs render --check && check; then
            echo "gate=ok" >> "$GITHUB_OUTPUT"
          else
            echo "gate=failed" >> "$GITHUB_OUTPUT"
          fi

      # Porcelain, never `git diff --quiet`: a finding filed for the first time
      # is not in the index. The push names its own branch. PATHS is every file
      # a pull writes, afterRender's included, so the PR is the gated tree.
      - name: Prepare the pull request
        id: prepare
        if: steps.insights.outputs.ready == 'true'
        env:
          BASE: ${{ github.event.repository.default_branch }}
          PATHS: ${{ steps.config.outputs.paths }}
        run: |
          # Word-split on purpose: PATHS is plain paths, checked when read.
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "Nothing changed: Loop has said nothing new since the last pull."
            exit 0
          fi
          DAY=$(date -u +%Y-%m-%d)
          BRANCH="plates-loop/$DAY"
          git config user.name "plates-loop"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          # shellcheck disable=SC2086
          git add -- $PATHS
          git commit -q -m "Loop: findings pulled $DAY"
          git bundle create "$RUNNER_TEMP/loop.bundle" "refs/heads/$BRANCH" "^$GITHUB_SHA"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Keep publication data
        id: transfer
        if: steps.insights.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/publication"
          if [ -f "$RUNNER_TEMP/loop.bundle" ]; then cp "$RUNNER_TEMP/loop.bundle" "$RUNNER_TEMP/publication/loop.bundle"; fi
          echo ready > "$RUNNER_TEMP/publication/ready"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.transfer.outputs.ready == 'true'
        with:
          name: plates-loop-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 1

      - name: Validation verdict
        id: validation
        if: always() && steps.insights.outputs.ready == 'true'
        env:
          GATE: ${{ steps.gate.outputs.gate }}
        run: |
          if [ "$GATE" != ok ]; then
            echo "::error::The gate did not pass on the pulled findings (gate: ${GATE:-not run}); the PR is left for a person."
            exit 1
          fi

      # Keep collection and validation independent in the run summary. A pull
      # can succeed while the build fails; neither implies accepted findings.
      - name: Collection and validation summary
        if: always()
        env:
          COLLECTION: ${{ steps.insights.outcome }}
          VALIDATION: ${{ steps.gate.outputs.gate }}
        run: |
          {
            echo '## Loop: collection and validation'
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Getting insights | ${COLLECTION:-not run} |"
            echo "| Project validation | ${VALIDATION:-not run} |"
            echo ''
            echo 'Collection retries only recognized transient read failures, at most twice. Validation is never retried automatically. A fetched finding is not an accepted or verified fix.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: loop
    if: always() && needs.loop.outputs.transfer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # Trusted source only: candidate commits are fetched as objects, never checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.loop.outputs.publication }}
          path: ${{ runner.temp }}/publication
      - name: Restore publication data
        run: |
          for file in loop.bundle; do
            if [ -f "$RUNNER_TEMP/publication/$file" ]; then cp "$RUNNER_TEMP/publication/$file" "$RUNNER_TEMP/$file"; fi
          done
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          HEAD: ${{ needs.loop.outputs.head }}
          DAY: ${{ needs.loop.outputs.day }}
        run: |
          BRANCH="plates-loop/$DAY"
          [ -n "$HEAD" ] || exit 0
          git fetch -q "$RUNNER_TEMP/loop.bundle" "refs/heads/$BRANCH"
          head=$(git rev-parse FETCH_HEAD)
          if [ "$head" != "$HEAD" ] || [ "$(git rev-parse "$head^")" != "$GITHUB_SHA" ]; then
            echo "::error::Publication commit or source revision mismatch; nothing is pushed."
            exit 1
          fi
          # The working tree remains the trusted workflow revision.
          gh auth setup-git
          git push --force origin "$head:refs/heads/plates-loop/$DAY"
          if ! gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number' | grep -q .; then
            cat > "$RUNNER_TEMP/loop-body.md" <<'PLATES_BODY'
          Stitch Loop insights, pulled as untriaged findings in docs/loop/ and generated views. No acceptance or architecture decision is made. An agent proposes; a person decides.

          If a custom afterRender step changes phase or decision records, review those edits and replace the declaration with their actual impact before merging. The impact check examines the diff.

          ```keel-impact
          {"version":1,"phases":[],"decisions":[],"supersedes":[],"evidence":[],"reconciliation":"none","reason":"Imports untriaged Loop findings and refreshes generated views only; no phase acceptance, next action, or architecture decision is changed."}
          ```
          PLATES_BODY
            code=0
            out=$(gh pr create --base "$BASE" --head "$BRANCH" --title "Loop: findings pulled $DAY" \
              --body-file "$RUNNER_TEMP/loop-body.md" 2>&1) || code=$?
            echo "$out"
            if [ "$code" != 0 ]; then
              if printf '%s' "$out" | grep -qi 'not permitted to create or approve pull requests'; then
                echo "::notice::$BRANCH is pushed, but no PR was opened: allow it in Settings → Actions → General → Workflow permissions."
              else
                exit "$code"
              fi
            fi
          fi

      # Older plates-loop PRs: merged when they hold only findings and still
      # merge, closed as superseded (branch kept) otherwise. The newest merges
      # only after the gate passed on this tree.
      - name: Drain the queue
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ needs.loop.outputs.gate }}
        run: |
          if [ ! -f scripts/plates/drain.mjs ]; then
            echo "::notice::No drain: scripts/plates/drain.mjs comes with plates's night practice; switch it on to keep the keel-loop/ queue at one PR."
            exit 0
          fi
          if [ "$GATE" = ok ]; then
            node scripts/plates/drain.mjs plates-loop/ --yes --gate-passed
          else
            node scripts/plates/drain.mjs plates-loop/ --yes
          fi
