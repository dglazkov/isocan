# The night shift (keel practice `night`; managed: keel render rewrites it).
#
# Each night: gather the test ledger's history (CI's keel-test-runs
# artifacts), measure the practice (scripts/keel/improve.mjs --report), put
# the dated health page on a branch of its own, open one pull request, and
# drain the queue (scripts/keel/drain.mjs) so it never holds more than one
# open `keel-night/` PR. Both scripts are managed files of this practice, in
# this repo: the night never fetches anything, and needs no secret of its own. The rules, each
# paid for once (keel docs/design.md §6, from isocan's "night shift's pull
# requests"):
#
#   - Measure first. Nothing here fixes anything; the page proposes one change.
#   - A bot writes a pull request, never to main. The only push names
#     refs/heads/keel-night/<date>.
#   - One open PR per queue, the newest; drain.mjs enforces it, not a person.
#   - A merge is checked, not trusted. A GITHUB_TOKEN PR never runs CI, so the
#     gate that improve.mjs runs here, on this tree, is the check; the
#     newest PR merges only when it passed and the PR holds nothing but data
#     (tonight's dated health page, docs/inbox/, docs/INBOX.md,
#     .keel/bounds.json; never the rest of the health directory, which may be
#     shared). The health directory is .keel/keel.json "health" (default
#     docs/health), read at run time; one the project git-ignores, or one
#     that resolves outside the repo (a symlink), makes the run red.
#   - A guard fires into a room someone is in. A broken instrument (improve
#     exit 2) or a failing gate makes this run red, and GitHub emails. A
#     measure outside its bound (exit 1) is news: it is on the page, not red.
#
# No secret of its own. A project whose `setup` must clone a private repo names
# a secret in .keel/keel.json "setupToken"; the Install step alone gets it, as
# GH_TOKEN. Repo setting: Actions must be allowed to create pull requests;
# until they are, the branch is pushed and the run ends green with a notice.
name: keel-night

on:
  schedule:
    # 07:23 UTC, off the hour, so it does not queue behind every other cron.
    - cron: "23 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: keel-night
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: read

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history: some measures read it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The project's install, read from .keel/keel.json at run time (so a
      # config change never needs a re-render): `setup` when it has one, else
      # npm ci when a lockfile exists. Its `env` goes to every later step
      # (scripts/keel/improve.mjs applies it to the gate too), so a gate that
      # must not sync or push is told so before anything runs.
      - name: Read the config
        id: config
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8"));
            const env = c.env ?? {};
            if (!env || typeof env !== "object" || Array.isArray(env)) throw new Error(".keel/keel.json: \"env\" must be an object of NAME: \"value\"");
            if (c.setup !== undefined && (typeof c.setup !== "string" || !c.setup.trim())) throw new Error(".keel/keel.json: \"setup\" must be a non-empty shell command");
            const tok = c.setupToken;
            if (tok !== undefined && (typeof tok !== "string" || !/^[A-Z_][A-Z0-9_]*$/.test(tok) || tok.startsWith("GITHUB_") || c.setup === undefined)) throw new Error(".keel/keel.json: \"setupToken\" must name a repo secret (not GITHUB_*) and needs a \"setup\"");
            const eof = `KEEL_EOF_${Date.now()}`;
            const lines = [];
            for (const [k, v] of Object.entries(env)) {
              if (!/^[A-Z_][A-Z0-9_]*$/.test(k) || typeof v !== "string") throw new Error(`.keel/keel.json: "env" ${k} must be NAME: "value"`);
              lines.push(`${k}<<${eof}`, v, eof);
              console.log(`env: ${k}`);
            }
            if (lines.length) fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup<<${eof}\n${c.setup ?? ""}\n${eof}\n`);
            // Only the secret NAME, never its value: the Install step looks it up.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup_token=${tok ?? ""}\n`);
            if (tok) console.log(`setupToken: ${tok} (a repo secret, for the Install step only)`);
          '
      # Where improve writes the health page and what the PR commits: the
      # project's own scripts/keel/lib.mjs reads .keel/keel.json "health"
      # (default docs/health), so improve, this workflow and drain agree.
      - name: Where the health page goes
        id: health
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { healthDirIn } from "./scripts/keel/lib.mjs";
            const dir = healthDirIn(".", JSON.parse(readFileSync(".keel/keel.json", "utf8")));
            console.log(`health: ${dir}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `dir=${dir}\n`);
          '
      - name: Install
        # setupToken (a secret's name in .keel/keel.json) becomes GH_TOKEN here
        # and in no other step, so setup can clone a private repo with gh
        # (ledger's data). Absent or unset, the job's own token. Never echoed.
        env:
          SETUP: ${{ steps.config.outputs.setup }}
          GH_TOKEN: ${{ secrets[steps.config.outputs.setup_token] || github.token }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "setup (.keel/keel.json): $SETUP"
            bash -e -c "$SETUP"
          elif [ -f package-lock.json ]; then
            npm ci
          fi

      # On keel itself only (its .keel/keel.json says "keel": "self"): lesson
      # issues and moved sources become inbox proposals. It reads and writes
      # files and decides nothing, so it runs before the measure that counts
      # the inbox. A project has no learn step: lessons go home from a person's
      # keel (keel lessons), never from a workflow.
      - name: Is this keel?
        id: self
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('.keel/keel.json', 'utf8')).keel === 'self' ? 0 : 1)"; then
            echo "self=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Gather what came home
        if: steps.self.outputs.self == 'true'
        run: node bin/keel.mjs learn || echo "::warning::keel learn did not finish; see its output above."

      # The test ledger's history (scripts/keel/test-ledger.mjs): the newest
      # keel-test-runs artifacts on the default branch (check.yml's, and past
      # nights'), read-only, by name, into .keel/test-runs. The gate improve
      # runs adds tonight's run to them, so flaky_tests and slow_tests read
      # more than one night; fewer runs than the window is n/a, never a zero.
      # Nothing found, or no listing, is a warning, not red.
      - name: Gather the test ledger
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p .keel/test-runs
          if ! gh api "repos/$REPO/actions/artifacts?name=keel-test-runs&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE\")] | sort_by(.created_at) | reverse | .[:30][] | .id" > "$RUNNER_TEMP/ledger.txt"; then
            echo "::warning::The test ledger's artifacts could not be listed; tonight reads its own run alone."
            exit 0
          fi
          n=0
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ledger-$id.zip"; then
              unzip -o -q "$RUNNER_TEMP/ledger-$id.zip" -d .keel/test-runs && n=$((n + 1))
            fi
          done < "$RUNNER_TEMP/ledger.txt"
          echo "test ledger: $n artifacts read; $(find .keel/test-runs -name '*.json' | wc -l | tr -d ' ') runs"

      # The newest climb night's record (the climb practice's keel-climb
      # artifact), read-only, by name, from the default branch only, into
      # .keel/climb, before improve writes its line on the health page. None
      # (climb off, or never run), or no listing, is no line: never red.
      - name: Gather the climb's record
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if ! gh api "repos/$REPO/actions/artifacts?name=keel-climb&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE\")] | sort_by(.created_at) | reverse | .[:1][] | .id" > "$RUNNER_TEMP/climb.txt"; then
            echo "::warning::The keel-climb artifacts could not be listed; the health page has no climb line tonight."
            exit 0
          fi
          id=$(head -n 1 "$RUNNER_TEMP/climb.txt")
          if [ -z "$id" ]; then
            echo "climb: no keel-climb record on $BASE"
            exit 0
          fi
          mkdir -p .keel/climb
          if gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/climb-$id.zip"; then
            unzip -o -q "$RUNNER_TEMP/climb-$id.zip" -d .keel/climb
            echo "climb: record $id read"
          else
            echo "::warning::The keel-climb record $id could not be read; the health page has no climb line tonight."
          fi

      # The newest tend pass's record (the climb practice's keel-tend
      # artifact), read the same way into .keel/tend: improve writes its Tend
      # line, naming each finding the pass left. None is no line: never red.
      - name: Gather the tend record
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if ! gh api "repos/$REPO/actions/artifacts?name=keel-tend&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE\")] | sort_by(.created_at) | reverse | .[:1][] | .id" > "$RUNNER_TEMP/tend.txt"; then
            echo "::warning::The keel-tend artifacts could not be listed; the health page has no tend line tonight."
            exit 0
          fi
          id=$(head -n 1 "$RUNNER_TEMP/tend.txt")
          if [ -z "$id" ]; then
            echo "tend: no keel-tend record on $BASE"
            exit 0
          fi
          mkdir -p .keel/tend
          if gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/tend-$id.zip"; then
            unzip -o -q "$RUNNER_TEMP/tend-$id.zip" -d .keel/tend
            echo "tend: record $id read"
          else
            echo "::warning::The keel-tend record $id could not be read; the health page has no tend line tonight."
          fi

      # Before the drain, so machine_prs counts last night's PR. improve also
      # writes the PR body's input (--pr-input); scripts/keel/pr-body.mjs
      # turns it into the body below, so no body is built in inline JS.
      - name: Measure
        id: improve
        run: |
          code=0
          node scripts/keel/improve.mjs --report --json --pr-input "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/improve.json" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const [file, out] = process.argv.slice(1);
            let r = {};
            try { r = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
            const gate = (r.measures ?? []).find(m => m.id === "gate");
            const day = r.date ?? new Date().toISOString().slice(0, 10);
            fs.appendFileSync(out, `gate=${gate?.state ?? "missing"}\nday=${day}\n`);
            for (const m of r.measures ?? []) console.log(`${m.id.padEnd(22)} ${String(m.value ?? "-").padStart(6)}  ${m.state.padEnd(8)} ${m.detail}`);
            if (r.error) console.log(`improve: ${r.error}`);
          ' "$RUNNER_TEMP/improve.json" "$GITHUB_OUTPUT"

      # Tonight's history, gate run included, for tomorrow night: the ledger
      # persists between nights only as this artifact (it is never committed).
      - name: Keep the test ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keel-test-runs
          path: .keel/test-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # Porcelain, never `git diff --quiet`: a file created for the first time
      # is not in the index, so diff reads it as no change (ledger's audit
      # agent lost every report to that). Only the night's data is committed:
      # tonight's page in the configured health directory (never the rest of
      # it), the inbox and the bounds, a tracked one that is gone staged as
      # its deletion. Paths are literal (GIT_LITERAL_PATHSPECS), never
      # pathspec magic. A page the project ignores is red: it would never be
      # committed (ledger lost its pages that way), so the probe is a dated
      # name, as improve writes. The push names its own branch.
      # The body is scripts/keel/pr-body.mjs's (Summary: the commit's files;
      # Evidence: the gate and the measures outside; Merge danger: two-way,
      # data only), from improve's --pr-input.
      - name: Open the night's pull request
        env:
          DAY: ${{ steps.improve.outputs.day }}
          BASE: ${{ github.event.repository.default_branch }}
          HEALTH: ${{ steps.health.outputs.dir }}
        run: |
          if [ -z "$HEALTH" ]; then
            echo "::error::No health directory was read from .keel/keel.json."
            exit 1
          fi
          PAGE="$HEALTH/$DAY.md"
          case "$PAGE" in :*) echo "::error::\"health\" starts with \":\" (git pathspec magic)."; exit 1 ;; esac
          ignored=0
          git check-ignore -q -- "$PAGE" || ignored=$?
          if [ "$ignored" = 0 ]; then
            echo "::error::$HEALTH is git-ignored ($PAGE), so its health page is never committed: set \"health\" in .keel/keel.json to a directory that is not ignored (keel doctor: health-ignored)."
            exit 1
          fi
          if [ "$ignored" != 1 ]; then
            echo "::error::git check-ignore could not read $PAGE (exit $ignored)."
            exit 1
          fi
          # check-ignore refuses literal pathspecs; every git call after it reads paths literally.
          export GIT_LITERAL_PATHSPECS=1
          PATHS=()
          for p in "$PAGE" docs/inbox docs/INBOX.md .keel/bounds.json; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then PATHS+=("$p"); fi
          done
          if [ "${#PATHS[@]}" = 0 ] || [ -z "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo "Nothing changed."
            exit 0
          fi
          BRANCH="keel-night/$DAY"
          git config user.name "keel-night"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add -A -- "${PATHS[@]}"
          git commit -q -m "keel night: $DAY"
          git show --name-only --format= HEAD > "$RUNNER_TEMP/files.txt"
          node scripts/keel/pr-body.mjs --input "$RUNNER_TEMP/pr.json" --files "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/body.md"
          # The branch is this workflow's alone; a re-run the same day replaces
          # its own reading, so force is safe here and nowhere else.
          git push --force origin "HEAD:refs/heads/keel-night/$DAY"
          if ! gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number' | grep -q .; then
            # A repo that has not allowed Actions to open PRs is unconfigured,
            # not broken: a notice, like a missing secret. Any other failure is red.
            code=0
            out=$(gh pr create --base "$BASE" --head "$BRANCH" --title "keel night: $DAY" --body-file "$RUNNER_TEMP/body.md" 2>&1) || code=$?
            echo "$out"
            if [ "$code" != 0 ]; then
              if printf '%s' "$out" | grep -qi 'not permitted to create or approve pull requests'; then
                echo "::notice::$BRANCH is pushed, but no PR was opened: allow it in Settings → Actions → General → Workflow permissions → \"Allow GitHub Actions to create and approve pull requests\"."
              else
                exit "$code"
              fi
            fi
          fi

      # Older keel-night PRs: merged when they are data and still merge,
      # closed as superseded (branch kept) otherwise. The newest merges only
      # after a gate that passed on this tree.
      - name: Drain the queue
        env:
          GATE: ${{ steps.improve.outputs.gate }}
        run: |
          if [ "$GATE" = ok ]; then
            node scripts/keel/drain.mjs keel-night/ --yes --gate-passed
          else
            node scripts/keel/drain.mjs keel-night/ --yes
          fi

      - name: Verdict
        if: always()
        env:
          CODE: ${{ steps.improve.outputs.code }}
          GATE: ${{ steps.improve.outputs.gate }}
        run: |
          if [ "$CODE" = 2 ] || [ -z "$CODE" ]; then
            echo "::error::An instrument is broken (improve.mjs exit ${CODE:-none}); the health page says which."
            exit 1
          fi
          if [ "$GATE" != ok ]; then
            echo "::error::The project's gate did not pass (gate: $GATE)."
            exit 1
          fi
          if [ "$CODE" = 1 ]; then
            echo "::notice::A measure is outside its bound; it is on the health page and in the PR's proposal."
          fi
