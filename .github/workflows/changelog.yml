# Last night's work, written up before anyone is awake to write it up.
#
# `docs/changelog/` is a page per day, and the rule in AGENTS.md is to add the
# day's entry when you finish a session's work. Rules that depend on someone
# remembering at the end of a long day are rules with holes in them, and a day
# with no entry is a day whose reasoning is gone — the diff survives, the
# argument does not.
#
# TWO STEPS, BECAUSE THEY ARE DIFFERENT KINDS OF WORK. scripts/changelog-day.mjs
# does the part a machine can be right about — which commits landed, how much
# they touched, and what each one said — and it needs no model. Turning that
# into an entry is a judgement about what mattered, and that is the model's
# job. If there is no key, the draft is opened anyway: a draft nobody has
# written up is worth far more than a missing day, because the commits are
# quoted in full and the writing can happen later.
name: changelog

on:
  schedule:
    # 08:03 UTC. GitHub's cron has no timezone and nobody lives in UTC; this is
    # 00:03 in winter and 01:03 in summer on the US west coast — after midnight
    # there either way, which is what "after midnight" has to mean to be true
    # twice a year. The script picks the day in America/Los_Angeles, so the
    # entry is for the day the people had, not the day the runner had.
    - cron: "3 8 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day to write up (YYYY-MM-DD). Blank = yesterday."
        required: false

concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `secrets` cannot be read from a step's `if`, only from the job's env.
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The script asks git for a day's commits; a shallow clone has only
          # the tip and would report every day as empty.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gather the day
        id: gather
        # Through the environment, not interpolated into the script: a
        # workflow_dispatch input is text somebody typed, and text somebody
        # typed does not belong in a command line. The script reports the day
        # it settled on — or nothing, on a quiet day, which skips the rest.
        env:
          DAY: ${{ inputs.day }}
        run: node scripts/changelog-day.mjs "$DAY"

      # The judgement pass. Skipped without a key, which leaves the draft to be
      # written by hand rather than leaving the day unrecorded.
      - name: Write it up
        if: steps.gather.outputs.day != '' && env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--allowedTools Bash,Read,Edit,Write"
          prompt: |
            docs/changelog/${{ steps.gather.outputs.day }}.md is a generated
            draft: the day's commits with their full messages, and nothing
            written yet. Turn it into an entry.

            Read docs/changelog/README.md first — it says what an entry is —
            and read two or three neighbouring entries to match how they are
            written. Then:

            - Replace the draft with a real entry in that same shape: a
              headline that says what the day was ABOUT, the reasoning behind
              the main changes, and the bugs whose cause was not where it
              looked. End with every commit subject from the day, so nothing
              is hidden by the summary.
            - Remove the `<!-- draft -->` marker and the draft note.
            - Add the day's row to the table in docs/changelog/README.md,
              newest at the top, in the same style as the rows already there.

            The commit messages in this repo carry the argument, not just the
            change — that argument is the thing worth preserving, so prefer it
            over restating file names. Where a day's work was later reverted,
            say so. Do not run the test suite or build anything; this is a
            writing task. Do not commit — the workflow does that.

      - name: Open the pull request
        if: steps.gather.outputs.day != ''
        env:
          # A model writing prose straight into main every night is how a
          # changelog quietly fills with things nobody agreed to. A PR is one
          # click to merge and one click to fix first. To publish directly
          # instead, replace this step with a commit and push to main.
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.gather.outputs.day }}
        run: |
          git config user.name "isocan changelog"
          git config user.email "noreply@github.com"
          git checkout -b "changelog/$DAY"
          git add docs/changelog
          git commit -m "Changelog: $DAY"
          git push -u origin "changelog/$DAY"
          gh pr create --base main --head "changelog/$DAY" \
            --title "Changelog: $DAY" \
            --body "Written from the day's commits by \`scripts/changelog-day.mjs\`. Read it before merging — the summary is a judgement, and judgements are the part worth checking."
