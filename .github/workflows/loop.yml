# Stitch Loop's insights, pulled nightly — the night shift's fourth workflow.
#
# READS LOOP AND WRITES FILES; DECIDES NOTHING AND SENDS NOTHING. A pull files
# new insights as `untriaged` findings in `docs/loop/`, refreshes what Loop says
# about the ones already there, and rebuilds `docs/LOOP.md` and the roadmap's
# Loop counts. It never runs `decide`, `push` or `mine`: a decision dismisses an
# insight for everybody in the workspace, and that is a person's act
# (`scripts/loop.mjs`, and the guide's "Triaging Loop's findings").
#
# The changelog's shape, deliberately: a scheduled gather and a pull request
# rather than a push. And the persona runs' rule for the merge: the diff is
# checked rather than trusted, and this run merges its own PR only when it
# touches nothing but the findings and their two views.
#
# TWO SECRETS, and the run skips with a notice when either is missing rather
# than going red — an unconfigured repo is not a broken one:
#
#   LOOP_API_KEY          the key `stitch` reads from the environment
#   STITCH_INSTALLER_URL  the installer's address. It is a secret and not a line
#                         in this file because it carries a read token for a
#                         bucket that is not public, and this repository is.
#
# `test/loop.test.ts` fails if that address is ever committed here.
name: loop

on:
  schedule:
    # 09:03 UTC — twenty minutes after the personas, so the four nightlies do
    # not race for the same runner minute or branch namespace.
    - cron: "3 9 * * *"
  workflow_dispatch:

concurrency:
  group: loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOOP_API_KEY: ${{ secrets.LOOP_API_KEY }}
      # The Linux build the installer serves reads its key from this name and
      # has no mention of LOOP_API_KEY (its strings say so); older builds read
      # LOOP_API_KEY. One secret, both names, so either build can see it.
      STITCH_API_KEY: ${{ secrets.LOOP_API_KEY }}
      STITCH_INSTALLER_URL: ${{ secrets.STITCH_INSTALLER_URL }}
    steps:
      - id: configured
        run: |
          if [ -z "$LOOP_API_KEY" ] || [ -z "$STITCH_INSTALLER_URL" ]; then
            echo "::notice::Skipped: add the LOOP_API_KEY and STITCH_INSTALLER_URL secrets to run the nightly pull."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # The whole history, because the suite the merge step runs reads it.
      - if: steps.configured.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: steps.configured.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.configured.outputs.enabled == 'true'
        run: npm ci

      # Pinned to the version the workspace was mined with, so a new release
      # cannot change what a nightly does. The installer is downloaded to a file
      # first, so a failed download stops the step instead of piping an error
      # page into bash. The Linux binary is a single file in ~/.local/bin.
      - name: Install the stitch CLI
        if: steps.configured.outputs.enabled == 'true'
        run: |
          curl -fsSL "$STITCH_INSTALLER_URL" -o "$RUNNER_TEMP/stitch-install.sh"
          bash "$RUNNER_TEMP/stitch-install.sh" 0.10.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stitch" --version

      # Loop is an experiment in the CLI and is off until it is switched on, per
      # runner: without this the pull stops at its first Loop call with
      # `"priorities" requires Loop` (the nightlies of 29 Sep to 1 Oct all did).
      # The command is `stitch enable loop` in newer builds and
      # `stitch yolo --enable loop` in the build the installer served on 1 Oct,
      # so try the new one and fall back. If neither works this step fails, and
      # it should: a pull that cannot reach Loop must not look like a quiet night.
      - name: Turn Loop on in the CLI
        if: steps.configured.outputs.enabled == 'true'
        run: stitch enable loop || stitch yolo --enable loop

      # An instrument that cannot reach Loop fails here, loudly. A quiet night
      # is a pull that changed nothing, which the next step notices.
      - name: Pull Loop's insights
        if: steps.configured.outputs.enabled == 'true'
        run: node scripts/loop.mjs pull

      - name: Open the pull request
        if: steps.configured.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain docs/loop docs/LOOP.md docs/ROADMAP.md)" ]; then
            echo "nothing changed — Loop has said nothing new since the last pull"
            exit 0
          fi
          DAY=$(date -u +%Y-%m-%d)
          git config user.name "isocan loop"
          git config user.email "noreply@github.com"
          git checkout -b "loop/$DAY"
          git add docs/loop docs/LOOP.md docs/ROADMAP.md
          git commit -m "Loop: findings pulled $DAY"
          git push -u origin "loop/$DAY" --force

          # One open pull request from this workflow at a time, the newest run's
          # (AGENTS.md, "The night shift's pull requests"). A pull is a refresh
          # of the same files, so an older one is superseded, not stale. Closing
          # keeps the branch, and the comment says how to get it back.
          for PR in $(gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName | startswith(\"loop/\")) | select(.headRefName != \"loop/$DAY\") | .number"); do
            gh pr close "$PR" --comment "Superseded by loop/$DAY, which pulls the same findings again. The branch is kept; reopen this PR to recover it." || true
          done

          gh pr list --head "loop/$DAY" --json number --jq '.[0].number' | grep -q . || \
            gh pr create --base main --head "loop/$DAY" \
              --title "Loop: findings pulled $DAY" \
              --body "Stitch Loop's insights, pulled. New ones are untriaged findings; nothing was decided and nothing was sent to Loop. Triage them with the loop script's propose; deciding is a person's."

          # **Merged only when the diff is the findings and their views, and the
          # checks pass on the branch itself.** PRs opened with GITHUB_TOKEN run
          # no pull_request workflows, so no suite has looked at this branch
          # unless this step runs it. A red check leaves the PR for a person.
          CHANGED="$(gh pr diff --name-only "loop/$DAY" || true)"
          if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE '^(docs/loop/|docs/LOOP\.md$|docs/ROADMAP\.md$)'; then
            if node scripts/loop.mjs render --check && node scripts/roadmap.mjs --check && npx vitest run test/loop.test.ts test/roadmap.test.ts packages/core/test/loop.test.ts; then
              gh pr merge --squash --delete-branch "loop/$DAY" \
                || echo "could not merge automatically — left for a person"
            else
              echo "the checks failed on the branch — left for a person"
            fi
          else
            echo "touches more than the findings and their views — left for a person"
          fi
