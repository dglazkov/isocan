# The practice page, nightly — the night shift's fifth workflow
# (docs/projects/practice/design.md, phase 0).
#
# READS EVERYTHING AND WRITES ONE PAGE. `scripts/practice.mjs` counts where the
# repo's own instruments leak — records that disagree, issues nobody names,
# queues with ages, gates that report something other than the truth,
# instruments measuring nothing, and the build loop's red runs and rework —
# each beside yesterday's number. No model, nothing written to a canvas,
# nothing outside `docs/practice/`. Closing an issue, moving a ceiling or
# editing `.claude/` is proposed on the page and never done here.
#
# The grades shape (AGENTS.md, "The night shift's pull requests"): one dated
# page a night in its own directory, so nights never touch the same bytes. The
# run merges its own PR after the suite passes ON THE BRANCH — a PR opened with
# GITHUB_TOKEN runs no pull_request workflow, so nothing else will have looked
# — then drains older `practice/` PRs oldest first.
name: practice

on:
  schedule:
    # 09:33 UTC — thirty minutes after loop.yml, so the five nightlies do not
    # race for the same runner minute or branch namespace.
    - cron: "33 9 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Date for the page (YYYY-MM-DD). Blank = today, US Pacific."
        required: false

concurrency:
  group: practice
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The whole history: the page reads git log (changelog days, stale
      # phases, rework), and the suite the merge step runs reads it too.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A plain install: the root `prepare` builds packages/web/dist, which
      # the bundle-headroom row measures. Nothing here builds it a second time.
      - run: npm ci

      - name: Write the practice page
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ inputs.day }}
        run: node scripts/practice.mjs ${DAY:+--day "$DAY"}

      - name: Open the pull request, merge it after the suite, drain the older ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain docs/practice)" ]; then
            echo "nothing changed — the same page, the same numbers"
            exit 0
          fi
          DAY=$(ls docs/practice/*.md | grep -v README | xargs -n1 basename | sed 's/\.md$//' | sort | tail -1)
          git config user.name "isocan practice"
          git config user.email "noreply@github.com"
          git checkout -b "practice/$DAY"
          git add docs/practice
          git commit -m "Practice: $DAY"
          git push -u origin "practice/$DAY" --force
          gh pr list --head "practice/$DAY" --json number --jq '.[0].number' | grep -q . || \
            gh pr create --base main --head "practice/$DAY" \
              --title "Practice: $DAY" \
              --body "Where the practice leaks tonight, each number beside yesterday's. Deterministic: no model, nothing written outside docs/practice/. The morning lap reads this page and fixes one row."

          # **Merged only when the diff is the page and the suite passes on the
          # branch.** Anything outside docs/practice/ stays for a person, which
          # is also the backstop if the script ever writes somewhere it should
          # not. `test/workflows.test.ts` runs SCOPE through this grep.
          SCOPE='^docs/practice/'
          CHANGED="$(gh pr diff --name-only "practice/$DAY" || true)"
          if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -Eqv "$SCOPE"; then
            if npm test; then
              gh pr merge --squash --delete-branch "practice/$DAY" \
                || echo "could not merge automatically — left for a person"
              # Older nights, oldest first: merged when they still merge,
              # closed as superseded (branch kept) when they no longer do.
              node scripts/lib/drain.mjs practice/ docs/practice/ --except "practice/$DAY"
            else
              echo "the suite failed on the branch — left for a person"
            fi
          else
            echo "touches more than docs/practice/ — left for a person"
          fi
