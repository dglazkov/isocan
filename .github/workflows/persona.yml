# The personas, run on a schedule — step 4 of docs/projects/personas/design.md,
# which is the night shift's step 2: "one agent, one canvas, posts one summary.
# No changes at all. Proves the ritual before trusting it with work."
#
# NOTHING IS CHANGED. Each run takes its persona's numbers, writes a dated page,
# and stops. It may not touch `.agents/personas/` — a runner that can edit its
# own goal can pass by lowering the bar — and `persona-run.mjs` compares the
# files before and after to prove it did not.
#
# The changelog's shape again: a scheduled gather, a dated page, a pull request
# rather than a push. A machine writing into `main` every night is how a
# directory quietly fills with things nobody agreed to.
name: personas

on:
  schedule:
    # 08:43 UTC — twenty minutes after the grades run, so the two nightlies do
    # not race for the same runner minute or branch namespace.
    - cron: "43 8 * * *"
  workflow_dispatch:
    inputs:
      persona:
        description: "One persona by name. Blank = all of them."
        required: false

concurrency:
  group: personas
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  personas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `secrets` cannot be read from a step's `if`, only from the job's env —
    # the same arrangement as changelog.yml.
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The goals point at commands that grade a page in a browser and run
      # eslint; both need the workspace installed and built.
      - run: npm ci
      - run: npm run build

      # The cheap tier's harness (docs/research/2026-09-07-small-personas.md).
      # A persona that declares a `budget` gets one bounded `claude -p` call on
      # a night its number misses — `librarian`, on Haiku, capped at $0.05.
      # Installed only when there is a key: without one the runner SKIPS the
      # small pass, says so on the page, and the finding waits for a person
      # like any other, so this workflow stays green before the secret exists.
      - name: Install the small tier's harness
        if: env.HAS_KEY == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # A MISSED goal is news and does not fail this step — the page is the
      # report, and a run that goes red every morning trains everybody to stop
      # looking. It fails for one reason: an instrument that would not run,
      # because a number nobody could take must never be filed as a zero.
      #
      # The key reaches ONLY personas with a declared budget: the runner never
      # starts a model for one without (`smallPassWanted`), so the nine opus
      # personas take their numbers here exactly as before, for $0.
      - name: Take each persona's numbers
        env:
          ONE: ${{ inputs.persona }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/persona-run.mjs ${ONE:---all}

      # A SEPARATE step, deliberately, and not something `persona-run.mjs` does.
      # The rule above is that a run writes its dated page and changes nothing
      # else — that is what stops a runner editing its own goal — so the index
      # is rebuilt once per nightly by the workflow, after every persona has
      # been and gone, rather than by any of them.
      #
      # It exists because the index was hand-kept and stopped: four run-days
      # behind by 1 Sep, on the one page the README asks every run to read
      # first.
      - name: Rebuild the review index
        run: node scripts/reviews.mjs

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain docs/reviews)" ]; then
            echo "nothing changed — the same readings as the last run"
            exit 0
          fi
          DAY=$(date -u +%Y-%m-%d)
          git config user.name "isocan personas"
          git config user.email "noreply@github.com"
          git checkout -b "personas/$DAY"
          git add docs/reviews
          git commit -m "Persona runs: $DAY"
          git push -u origin "personas/$DAY" --force
          gh pr list --head "personas/$DAY" --json number --jq '.[0].number' | grep -q . || \
            gh pr create --base main --head "personas/$DAY" \
              --title "Persona runs: $DAY" \
              --body "Each persona's numbers, taken and written down. Nothing was changed — not the code, not the personas, not a canvas. A goal marked MISSED is a finding; write \`accepted\` or \`rejected\` beside it in the Findings table when you have decided."

          # **The reports merge themselves, and only the reports.**
          #
          # The comment at the top of this file says a pull request rather than
          # a push, because "a machine writing into main every night is how a
          # directory quietly fills with things nobody agreed to". That worry
          # was right and it is now answered somewhere better: a finding sits
          # `unanswered` for three days and then reddens the suite
          # (`test/review-queue.test.ts`). Agreement is forced on the FINDINGS,
          # which is what anybody was ever going to disagree with — not on the
          # act of filing a dated page.
          #
          # Leaving the merge to a person did not work: eight of these piled up
          # unmerged while the number one of them described grew a hundred
          # kilobytes, and a report nobody merges is a report nobody wrote. The
          # queue guard cannot see a finding that never reaches `main`, so
          # without this the guard is watching an empty room.
          #
          # The diff is checked rather than trusted: anything outside
          # docs/reviews/ and this PR stays for a person, which is also the
          # backstop if `persona-run.mjs` ever writes somewhere it should not.
          CHANGED="$(gh pr diff --name-only "personas/$DAY" || true)"
          if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qv '^docs/reviews/'; then
            gh pr merge --squash --delete-branch "personas/$DAY" \
              || echo "could not merge automatically — left for a person"
          else
            echo "touches more than docs/reviews/ — left for a person"
          fi
