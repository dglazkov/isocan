# The morning (keel practice `night`; managed: keel render rewrites it).
#
# When the night is over, one message says what it did (keel phase 77; the
# design is docs/research/2026-10-14-nightwatch.md, "The plan is a live card,
# and the morning sends a message"). The night is over when every build item
# in its plan is terminal (done, failed, skipped or left alone), or at the
# plan's readyBy (default 17:00 UTC), when what is unfinished is "not finished
# by" that time, never done. Then:
#
#   - Send, once a night: the brief as one issue "Good morning, <date>",
#     assigned to .keel/keel.json "morning" "assignee" and labelled
#     keel:morning; GitHub emails the assignee. The previous open brief is
#     closed. No assignee is a notice, not red: nothing is sent until the
#     owner names one.
#   - Finalize (keel#137), on every run once the night is over, sent or not:
#     the plan's final outcomes into the night's archive,
#     docs/night/<date>.json and the health page's "Tonight's plan", as one
#     data-only PR in the night's queue (keel-night/<date>-final), which the
#     night's drain merges with the series. So a finalization that failed
#     after the send, or a build that finished after a brief sent at
#     readyBy, still reaches the archive; a run with nothing new changes
#     nothing.
#
#   - The card (keel phase 78), on every run, over or not: tonight's plan as
#     it stands, republished as the canvas's live card night-plan, when the
#     canvas is set for nightly publishing and lists night-plan live (else a
#     notice, nothing more). It is keel canvas night's provisioning, exactly:
#     the owner-pinned keel and isocan the project's setup installs, the
#     dedicated isocan home, and the one canvas journal the night and the
#     card share (scripts/keel/canvas-recovery.mjs).
#
# decide, finalize and send are scripts/keel/morning.mjs, a managed file of
# this practice: no model, no install, no secret beyond the job's own token.
# Each job holds only what it needs: decide reads; finalize writes contents
# and a PR; only send writes issues; the card job reads (contents, and the
# actions artifacts its journal lives in) and writes only the canvas,
# through the isocan identity the owner provisioned. A failed send,
# finalization or card turns the run red, and GitHub emails: a guard fires
# into a room someone is in.
#
# Started by each pass finishing (keel-night, keel-climb, keel-robot; one that
# is not installed never starts it), and once a day at 17:07 UTC, just after
# the default readyBy, to catch "readyBy has passed" when no pass finishes
# after it. A plan whose readyBy is another time is caught by the next pass
# to finish or the next daily run, whichever comes first; one whose readyBy
# falls after the next night starts (07:23 UTC) and never finishes gets no
# brief, since decide then reads the new night. A run that finds the night
# not over does nothing more; one that finds the brief sent only finalizes.
name: keel-morning

on:
  workflow_run:
    workflows: [keel-night, keel-climb, keel-robot]
    types: [completed]
  schedule:
    # 17:07 UTC, just after the default readyBy (17:00 UTC).
    - cron: "7 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: keel-morning
  cancel-in-progress: false

permissions: {}

jobs:
  # Read-only: is the night that last started over, and was its brief sent?
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      day: ${{ steps.decide.outputs.day }}
      ready: ${{ steps.decide.outputs.ready }}
      sent: ${{ steps.decide.outputs.sent }}
      assignee: ${{ steps.decide.outputs.assignee }}
      plan: ${{ steps.decide.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Is the night over?
        id: decide
        run: |
          node scripts/keel/morning.mjs decide --github-output "$GITHUB_OUTPUT"
          if grep -q '^assignee=unset$' "$GITHUB_OUTPUT"; then
            echo "::notice::The morning brief is not sent: set \"morning\": { \"assignee\": \"<login>\" } in .keel/keel.json."
          fi

  # The night's final outcomes, as one data-only PR in its queue (keel#137).
  finalize:
    needs: decide
    if: needs.decide.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      DAY: ${{ needs.decide.outputs.day }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The branch it starts from: its own (a rerun the same night changes
      # only what moved), else the night's PR branch while the default branch
      # lacks the night's page (the night's PR is still open), else the
      # default branch. The push names its own branch.
      - name: Open the night's final pull request
        run: |
          case "$DAY" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::No night was decided (day: $DAY)."; exit 1 ;; esac
          BRANCH="keel-night/$DAY-final"
          HEALTH=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { healthDirIn } from "./scripts/keel/lib.mjs";
            console.log(healthDirIn(".", JSON.parse(readFileSync(".keel/keel.json", "utf8"))));
          ')
          START=HEAD
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch -q --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            START="refs/remotes/origin/$BRANCH"
          elif [ ! -f "$HEALTH/$DAY.md" ] && git ls-remote --exit-code --heads origin "keel-night/$DAY" > /dev/null; then
            git fetch -q --no-tags origin "+refs/heads/keel-night/$DAY:refs/remotes/origin/keel-night/$DAY"
            START="refs/remotes/origin/keel-night/$DAY"
          fi
          git checkout -q -B "$BRANCH" "$START"
          node scripts/keel/morning.mjs finalize --date "$DAY" --pr-input "$RUNNER_TEMP/pr.json"
          export GIT_LITERAL_PATHSPECS=1
          PATHS=("docs/night/$DAY.json")
          if [ -f "$HEALTH/$DAY.md" ]; then PATHS+=("$HEALTH/$DAY.md"); fi
          if [ -z "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo "Nothing changed: the night's archive already holds its final outcomes."
            exit 0
          fi
          git config user.name "keel-morning"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${PATHS[@]}"
          git commit -q --only -m "keel night: $DAY, as it finished" -- "${PATHS[@]}"
          git show --name-only --format= HEAD > "$RUNNER_TEMP/files.txt"
          node scripts/keel/pr-body.mjs --input "$RUNNER_TEMP/pr.json" --files "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/body.md"
          # The branch is this workflow's alone; a rerun the same night
          # replaces its own commit, so force is safe here and nowhere else.
          git push --force origin "HEAD:refs/heads/keel-night/$DAY-final"
          PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
          else
            code=0
            out=$(gh pr create --base "$BASE" --head "$BRANCH" --title "keel night: $DAY, as it finished" --body-file "$RUNNER_TEMP/body.md" 2>&1) || code=$?
            echo "$out"
            if [ "$code" != 0 ]; then
              if printf '%s' "$out" | grep -qi 'not permitted to create or approve pull requests'; then
                echo "::notice::$BRANCH is pushed, but no PR was opened: allow it in Settings → Actions → General → Workflow permissions → \"Allow GitHub Actions to create and approve pull requests\"."
              else
                exit "$code"
              fi
            fi
          fi

  # The one job that writes issues: the brief, once a night.
  send:
    needs: decide
    if: needs.decide.outputs.ready == 'true' && needs.decide.outputs.sent != 'true' && needs.decide.outputs.assignee == 'set'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      DAY: ${{ needs.decide.outputs.day }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Send the brief
        run: node scripts/keel/morning.mjs send --date "$DAY"

  # The plan's live card, after each pass (keel phase 78): tonight's plan as
  # it stands (finalPlan: each item at its furthest tick), republished as the
  # canvas card night-plan, so it ticks through the night with no one at a
  # keyboard. Only when the canvas is set for nightly publishing and the
  # binding lists night-plan live; otherwise a notice and nothing else.
  # Exactly `keel canvas night`'s provisioning and guards (keel-night.yml's
  # canvas step): the project's setup installs the owner-pinned keel and
  # isocan, its .keel/keel.json env names the pins and the dedicated admitted
  # isocan home, and the one canvas journal is restored from the newest
  # canvas writer (the night or this job) and saved for the next
  # (scripts/keel/canvas-recovery.mjs). No new credential: the canvas
  # identity is that isocan home's; GitHub sees only the job's own token,
  # which reads. A person's edit to the card stops its updates: the live
  # card's conditional edit refuses (red, naming keel canvas rebase).
  card:
    needs: decide
    if: needs.decide.outputs.plan == 'found' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      DAY: ${{ needs.decide.outputs.day }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The canvas set for nightly publishing (keel canvas night's own
      # switch), and the binding live with night-plan among its cards.
      - name: Is the card set up?
        id: gate
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8")).canvas;
            const why = c?.enabled !== true || c?.cadence !== "nightly"
              ? "the canvas is not set for nightly publishing (.keel/keel.json canvas.enabled true and cadence \"nightly\", as keel canvas night needs)"
              : c.mode !== "live" || !(c.liveKeys ?? ["pulse"]).includes("night-plan")
                ? "the canvas binding does not list night-plan live (keel canvas live --card pulse --card night-plan --yes)"
                : null;
            if (why) console.log(`::notice::The plan card is not republished: ${why}. Nothing else is done.`);
            else fs.appendFileSync(process.env.GITHUB_OUTPUT, "enabled=true\n");
          '
      # keel-night.yml's own two steps: the config's env for every later
      # step, and the project's setup (setupToken, if named, here alone).
      - name: Read the config
        id: config
        if: steps.gate.outputs.enabled == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".keel/keel.json", "utf8"));
            const env = c.env ?? {};
            if (!env || typeof env !== "object" || Array.isArray(env)) throw new Error(".keel/keel.json: \"env\" must be an object of NAME: \"value\"");
            if (c.setup !== undefined && (typeof c.setup !== "string" || !c.setup.trim())) throw new Error(".keel/keel.json: \"setup\" must be a non-empty shell command");
            const tok = c.setupToken;
            if (tok !== undefined && (typeof tok !== "string" || !/^[A-Z_][A-Z0-9_]*$/.test(tok) || tok.startsWith("GITHUB_") || c.setup === undefined)) throw new Error(".keel/keel.json: \"setupToken\" must name a repo secret (not GITHUB_*) and needs a \"setup\"");
            const eof = `KEEL_EOF_${Date.now()}`;
            const lines = [];
            for (const [k, v] of Object.entries(env)) {
              if (!/^[A-Z_][A-Z0-9_]*$/.test(k) || typeof v !== "string") throw new Error(`.keel/keel.json: "env" ${k} must be NAME: "value"`);
              lines.push(`${k}<<${eof}`, v, eof);
              console.log(`env: ${k}`);
            }
            if (lines.length) fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup<<${eof}\n${c.setup ?? ""}\n${eof}\n`);
            // Only the secret NAME, never its value: the Install step looks it up.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup_token=${tok ?? ""}\n`);
            if (tok) console.log(`setupToken: ${tok} (a repo secret, for the Install step only)`);
          '
      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        # setupToken (a secret's name in .keel/keel.json) becomes GH_TOKEN here
        # and in no other step, as in keel-night.yml. Never echoed.
        env:
          SETUP: ${{ steps.config.outputs.setup }}
          GH_TOKEN: ${{ secrets[steps.config.outputs.setup_token] || github.token }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "setup (.keel/keel.json): $SETUP"
            bash -e -c "$SETUP"
          elif [ -f package-lock.json ]; then
            npm ci
          fi
      - name: Publish the plan card
        id: canvas
        if: steps.gate.outputs.enabled == 'true'
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          # A preflight failure never reaches the canvas: it leaves a receipt
          # saying so, and the next writer recovers from the attempt before it.
          preflight_fail() {
            node -e 'const fs = require("node:fs"); fs.mkdirSync(require("node:path").dirname(process.argv[1]), { recursive: true }); fs.writeFileSync(process.argv[1], JSON.stringify({ neverRan: true, provenance: { repo: process.env.GITHUB_REPOSITORY, workflow: ".github/workflows/keel-morning.yml", runId: String(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), headSha: process.env.GITHUB_SHA } }))' "$RUNNER_TEMP/keel-canvas-card/never-ran.json"
            echo "::error::$1"
            exit 1
          }
          for tool in keel isocan; do
            command -v "$tool" >/dev/null 2>&1 || preflight_fail "Canvas night requires $tool explicitly installed and pinned by the project setup."
          done
          if [ -z "${KEEL_CANVAS_KEEL_VERSION:-}" ] || [ -z "${KEEL_CANVAS_ISOCAN_VERSION:-}" ]; then
            preflight_fail "Canvas night requires owner-pinned KEEL_CANVAS_KEEL_VERSION and KEEL_CANVAS_ISOCAN_VERSION."
          fi
          if [ "$(keel --version)" != "$KEEL_CANVAS_KEEL_VERSION" ] || [ "$(isocan --version)" != "$KEEL_CANVAS_ISOCAN_VERSION" ]; then
            preflight_fail "Canvas executable version does not match its owner-provisioned pin."
          fi
          if [ -z "${KEEL_CANVAS_ISOCAN_HOME:-}" ] || [ ! -d "$KEEL_CANVAS_ISOCAN_HOME" ]; then
            preflight_fail "Canvas night requires a dedicated owner-provisioned admitted isocan home (KEEL_CANVAS_ISOCAN_HOME)."
          fi
          case "$DAY" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) preflight_fail "No night was decided (day: $DAY)." ;; esac
          # The newest canvas writer's journal (the night's or a card's). Exit 3:
          # a writer is still running; this pass waits, and the next one republishes.
          found=0
          recovery=$(node scripts/keel/canvas-recovery.mjs --workflow keel-morning.yml) || found=$?
          if [ "$found" = 3 ]; then
            echo "::notice::Another canvas writer is still running; the plan card waits for the next pass. The canvas was not touched."
            exit 0
          fi
          [ "$found" = 0 ] || preflight_fail "Canvas recovery stopped before the canvas was touched; this attempt is recorded as never run."
          export KEEL_CANVAS_RECOVERY="$recovery"
          export KEEL_CANVAS_PERSISTENCE=artifact-v1
          export KEEL_ISOCAN="$(command -v isocan)"
          export ISOCAN_HOME="$KEEL_CANVAS_ISOCAN_HOME"
          export KEEL_CANVAS_OUTPUT="$RUNNER_TEMP/keel-canvas-card"
          keel morning --card --yes --date "$DAY" --json

      - name: Keep the canvas journal
        if: always() && steps.canvas.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: keel-canvas-card-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keel-canvas-card/
          if-no-files-found: ignore
          retention-days: 90
