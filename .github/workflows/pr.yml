name: pr

# **Test a change BEFORE main, not after it.**
#
# Until this file existed, every workflow here triggered on `schedule`,
# `workflow_dispatch`, or `push: branches: [main]` — so main was the first
# place anything in this repo was ever tested, and a pull request got review
# but no run at all.
#
# What that cost, on one morning (6 September 2026): a research note merged
# with no `issue:` in its front matter turned `docstatus.test.ts` red on main,
# which held `green` back by ELEVEN commits, which stopped dev.isocan.io
# deploying, and was noticed only when somebody went to promote to prod and
# found `green` four days stale. The same day, a second change made
# `docs/ROADMAP.md` stale and would have reddened main a second time; it was
# caught by running the suite by hand before merging, which is not a system.
# Every one of those is a thing this file would have caught, on the branch,
# before it mattered to anyone else.
#
# It is deliberately NOT a required check in branch protection. An advisory
# run that people read is the smaller promise, and deleting this file is the
# whole rollback; making it required is a separate decision with a separate
# cost (a flaky suite becomes a merge blocker) and should be argued on its own.

on:
  pull_request:
  workflow_dispatch:

# **Cancel, do not queue — the opposite of `release.yml`, on purpose.**
#
# There, every commit gets its release in order, so runs queue. Here only the
# newest commit on a branch is interesting: a run against a commit somebody has
# already pushed past is spending eight minutes to answer a question nobody is
# asking any more.
concurrency:
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # it reads the tree and writes nothing — no branch, no tag

jobs:
  # ---- the suite, in four pieces, the way `release.yml` runs it ----
  #
  # **This job was one runner carrying the whole of `test:ci` under a 20-minute
  # timeout, and it stopped being able to finish.** The last pull request run
  # that passed took 19m43s; the ones after it were cancelled at about 20m20s,
  # which is the timeout, not a verdict. `release.yml` split its suite four
  # ways on 13 September because the suite was 82% of a release run, and this
  # file did not follow — the guard that holds the shard count to the matrix
  # read only `release.yml`, so nothing noticed the one that was still whole.
  # Renovate's automerge waits on this check, so a check that times out is not
  # advisory, it is a queue that never drains.
  #
  # Same denominator as `release.yml`, on purpose: the two files are meant to
  # test the same thing the same way, and a PR split some other way is a
  # second set of shard boundaries for a file-order bug to hide behind. The
  # slowest release shard takes about eight to ten minutes, so the timeout
  # below is headroom again rather than a coin toss.
  #
  # `test/workflows.test.ts` now holds EVERY workflow that runs `test:ci` to
  # the sharded shape, found by reading this directory — so a third one, or
  # this one un-split, fails the suite instead of timing out a month later.
  #
  # `fail-fast: false` for the reason `release.yml` gives: one red shard should
  # not hide the other three.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          # **The suite reads git history, so a shallow checkout fails it.**
          # `changelog-day.mjs` asks `git log` what landed on a day, and
          # `changelog.test.ts` drives it against the EARLIEST entry — which on
          # a depth-1 clone is a day with no commits in view, so the generator
          # answers "nothing landed" where the test expects "already written".
          #
          # `release.yml` has had this since it was written, for its own
          # unrelated reason (it pushes a commit naming two parents by sha),
          # which is exactly why it did not travel: the shared `suite-setup`
          # action cannot carry a checkout, and the reason written beside it
          # there is not this reason. The comment below about drift between
          # these two files was already here, and this is the drift it
          # described, in the file that carries it.
          fetch-depth: 0

      # Node, Java, the Firestore emulator and `npm ci` — the same steps
      # `release.yml` runs, because they are the same steps. Shared rather
      # than copied: the drift that matters is this file falling behind that
      # one, which would leave pull requests green while main went red, and a
      # comment asking two files to stay in step is not a guard.
      - uses: ./.github/actions/suite-setup

      # `test:ci` — the same command `release.yml` runs, with every anti-skip
      # switch on, and for the same reason. A pull-request check that can pass
      # without testing the cloud backing, or without the deep lane's CLI
      # walks, is a check that will eventually wave through the one change
      # that breaks them, and it would do it while main went red. The list of
      # switches and the argument for each is `scripts/switches.mjs`; the
      # point of running one named command is that this file and `release.yml`
      # cannot come to disagree about what CI tests.
      - run: npm run test:ci -- --shard=${{ matrix.shard }}/4

      - name: Keep test timings
        if: always()
        continue-on-error: true # Telemetry availability does not change the test verdict.
        uses: actions/upload-artifact@v4
        with:
          name: test-profile-${{ matrix.shard }}
          path: .isocan/test-profile.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # Everything that is not the suite, on its own runner and at the same time —
  # `release.yml`'s `checks` job, minus the steps that only matter to a
  # release. Typecheck and lint used to run AFTER the suite on the same
  # runner, which put them inside its 20 minutes and behind its verdict: a
  # type error was reported only once a quarter of an hour of tests had
  # passed, and not at all when they timed out.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The default shallow checkout: neither step below reads history, and
      # `fetch-depth: 0` is the suite's need, not this job's.
      - uses: actions/checkout@v5

      # Node, Java, the Firestore emulator and `npm ci`. More than typecheck
      # and lint need, but the same setup the suite gets, and one setup is
      # the point of the action.
      - uses: ./.github/actions/suite-setup
      - run: npm run typecheck
      - run: npm run lint
